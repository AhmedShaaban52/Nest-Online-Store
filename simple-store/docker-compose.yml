version: '3.8'

services:
  # Database Service
  postgres:
    image: postgres:15-alpine
    container_name: simple-store-db
    restart: always
    environment:
      POSTGRES_USER: store_user
      POSTGRES_PASSWORD: store_password
      POSTGRES_DB: simple_store_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # NestJS Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simple-store-backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgres://store_user:store_password@postgres:5432/simple_store_db?sslmode=disable
      JWT_SECRET: superSecretJwtKeyForSimpleStoreLocal123!
    depends_on:
      - postgres
    # Automatically apply schema migration and sync database on container startup, then start NestJS
    command: sh -c "npx prisma db push && node dist/main"

# Volumes to persist data on the host machine
volumes:
  postgres_data:
